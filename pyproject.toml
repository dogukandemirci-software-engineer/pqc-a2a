[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-a2a"
version = "0.1.0"
description = "Hybrid post-quantum authenticated A2A messaging library"
requires-python = ">=3.10"
dependencies = ["liboqs-python==0.16.0", "cryptography>=50.0.0", "aioquic==1.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
analysis = ["matplotlib>=3.8"]

[project.scripts]
pqc-a2a = "pqc_a2a.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
